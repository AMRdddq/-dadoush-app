<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#243A70">
<link rel="manifest" href="manifest.json">
<title>دعدوش</title>

<style>
:root{
  --navy:#243A70;
  --bg:#f5f7fb;
  --text:#17213b;
  --muted:#7a8499;
  --green:#16845f;
  --red:#c4473f;
  --line:#e4e8f0;
  --amber:#a66a00;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--navy);
  color:#fff;
  padding:22px 16px 18px;
}

.wrap,main{
  max-width:680px;
  margin:auto;
}

h1{
  margin:0;
  font-size:28px;
}

.sub{
  opacity:.82;
  font-size:13px;
  margin-top:4px;
}

main{
  padding:14px 14px 95px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}

.stat,.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 4px 16px rgba(25,38,70,.05);
}

.stat{
  padding:14px;
}

.stat small{
  color:var(--muted);
}

.stat b{
  display:block;
  font-size:21px;
  margin-top:4px;
}

.card{
  padding:14px;
  margin-bottom:12px;
}

input,textarea,select{
  width:100%;
  padding:14px;
  border:1px solid var(--line);
  border-radius:13px;
  font-size:17px;
  background:#fff;
  color:var(--text);
}

button{
  border:0;
  border-radius:13px;
  padding:14px 15px;
  font-size:17px;
  font-weight:800;
}

.primary{background:var(--navy);color:#fff}
.green{background:var(--green);color:#fff}
.red{background:var(--red);color:#fff}
.light{background:#eef1f7;color:var(--navy)}

.full{width:100%}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.row>*{flex:1}

.hidden{display:none}

.section-title{
  font-size:18px;
  font-weight:900;
  margin:18px 2px 8px;
}

.trader{
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  margin-top:9px;
  background:#fff;
}

.trader-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.balance{font-weight:900}

.muted{
  color:var(--muted);
  font-size:13px;
}

.tag{
  display:inline-block;
  font-size:12px;
  font-weight:800;
  padding:4px 8px;
  border-radius:999px;
  margin-top:6px;
}

.tag.receive{
  background:#e9f7f1;
  color:var(--green);
}

.tag.pay{
  background:#fff0ef;
  color:var(--red);
}

.tag.none{
  background:#fff7e8;
  color:var(--amber);
}

.screen-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.screen-title h2{
  margin:0;
  font-size:22px;
}

.big-balance{
  text-align:center;
  padding:18px;
  border-radius:16px;
  background:#f8f9fc;
  margin:10px 0 14px;
}

.big-balance small{
  color:var(--muted);
}

.big-balance b{
  display:block;
  font-size:32px;
  margin-top:4px;
}

.entry{
  padding:11px 0;
  border-bottom:1px solid var(--line);
}

.entry:last-child{
  border-bottom:0;
}

.entry-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.fab{
  position:fixed;
  left:18px;
  right:18px;
  bottom:18px;
  max-width:644px;
  margin:auto;
}

.notice{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
  margin-top:8px;
}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <h1>دعدوش</h1>
    <div class="sub">حسابات ودفعات التجار</div>
  </div>
</header>

<main>

<section id="homeScreen">

  <div class="stats">

    <div class="stat">
      <small>عدد التجار إلي عندهم</small>
      <b id="countReceive">0</b>
    </div>

    <div class="stat">
      <small>عدد التجار إلهم عندي</small>
      <b id="countPay">0</b>
    </div>

    <div class="stat">
      <small>مجموع إلي عند التجار</small>
      <b id="totalReceive" style="font-size:22px;white-space:nowrap;">0.00 ₪</b>
    </div>

    <div class="stat">
      <small>مجموع للتجار عندي</small>
      <b id="totalPay" style="font-size:22px;white-space:nowrap;">0.00 ₪</b>
    </div>

  </div>

  <div class="card">
    <input id="search" placeholder="ابحث عن تاجر..." oninput="renderTraders()">
    <div id="traderList"></div>
  </div>

  <div class="card">
    <div class="row">

      <button class="light full" onclick="exportBackup()">
        نسخة احتياطية
      </button>

      <label class="light full"
      style="display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:13px;cursor:pointer">
        استرجاع
        <input type="file" accept=".json" onchange="importBackup(event)" hidden>
      </label>

    </div>

    <div class="notice">
      التجار القدامى رح يظهروا تحت "حدد نوع الحساب" لحد ما تختار:
      لي عنده أو له عندي.
    </div>
  </div>

  <button class="primary full fab" onclick="openAddTrader()">
    + تاجر جديد
  </button>

</section>


<section id="addTraderScreen" class="hidden">

  <div class="screen-title">
    <h2>تاجر جديد</h2>
    <button class="light" onclick="goHome()">رجوع</button>
  </div>

  <div class="card">

    <input id="newName" placeholder="اسم التاجر">

    <input id="newPhone"
    style="margin-top:8px"
    placeholder="رقم الهاتف - اختياري">

    <select id="newType" style="margin-top:8px">
      <option value="">اختر نوع الحساب</option>
      <option value="receive">لي عنده — هو بده يدفعلي</option>
      <option value="pay">له عندي — أنا بدي أدفعله</option>
    </select>

    <input id="newAmount"
    type="number"
    inputmode="decimal"
    style="margin-top:8px"
    placeholder="المبلغ الافتتاحي - اختياري">

    <textarea id="newNotes"
    style="margin-top:8px"
    rows="3"
    placeholder="ملاحظات - اختياري"></textarea>

    <button class="primary full"
    style="margin-top:12px"
    onclick="saveTrader()">
      حفظ
    </button>

  </div>

</section>


<section id="accountScreen" class="hidden">

  <div class="screen-title">
    <h2 id="accountName"></h2>
    <button class="light" onclick="goHome()">رجوع</button>
  </div>

  <div class="card">

    <label>نوع الحساب</label>

    <select id="accountType" onchange="changeType()">
      <option value="">حدد نوع الحساب</option>
      <option value="receive">لي عنده — هو بده يدفعلي</option>
      <option value="pay">له عندي — أنا بدي أدفعله</option>
    </select>

  </div>

  <div class="big-balance">
    <small id="balanceLabel">المبلغ المتبقي</small>
    <b id="accountBalance">0.00 ₪</b>
  </div>

  <div class="card">

    <input id="amount"
    type="number"
    inputmode="decimal"
    placeholder="اكتب المبلغ">
<select id="currency">
  <option value="ILS">₪ شيكل</option>
  <option value="USD">$ دولار</option>
</select>
    <input id="entryDate"
    type="date"
    style="margin-top:8px">

    <input id="entryNote"
    style="margin-top:8px"
    placeholder="ملاحظة - اختياري">

    <div class="row" style="margin-top:10px">

      <button class="red" onclick="addEntry('charge')">
        إضافة مبلغ
      </button>

      <button class="green" onclick="addEntry('payment')">
        تسجيل دفعة
      </button>

    </div>

  </div>

  <div class="card">
    <h3 style="margin:0 0 8px">كشف الحساب</h3>
    <div id="entries"></div>
  </div>

</section>

</main>

<script>

const KEY = "dadoush_pwa_v1";

let db = {
  traders: [],
  entries: []
};

let currentTrader = null;


function load(){

  try{

    const raw = localStorage.getItem(KEY);

    if(raw){
      db = JSON.parse(raw);
    }

    if(!Array.isArray(db.traders)){
      db.traders = [];
    }

    if(!Array.isArray(db.entries)){
      db.entries = [];
    }

  }catch(e){

    db = {
      traders: [],
      entries: []
    };

  }

}


function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(db)
  );

}


function uid(){

  return "id_" +
  Date.now() +
  "_" +
  Math.random().toString(36).slice(2);

}


function money(n){

  return Number(n || 0).toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  ) + " ₪";

}


function esc(s){

  return String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


function traderEntries(tid){

  return db.entries.filter(
    e => e.tid === tid
  );

}


function isCharge(e){

  return (
    e.type === "charge" ||
    e.type === "debt"
  );

}


function remaining(tid, currencyCode = "ILS"){
return traderEntries(tid).filter(e => (e.currency || "ILS") === currencyCode).reduce(
    (sum,e) => {

      if(isCharge(e)){
        return sum + Number(e.amount);
      }

      return sum - Number(e.amount);

    },
    0
  );

}


function show(id){

  [
    "homeScreen",
    "addTraderScreen",
    "accountScreen"
  ].forEach(
    x => document
      .getElementById(x)
      .classList
      .add("hidden")
  );

  document
    .getElementById(id)
    .classList
    .remove("hidden");

}


function today(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


function goHome(){

  currentTrader = null;

  show("homeScreen");

  renderTraders();

}


function openAddTrader(){

  newName.value = "";
  newPhone.value = "";
  newType.value = "";
  newAmount.value = "";
  newNotes.value = "";

  show("addTraderScreen");

}


function saveTrader(){

  const name =
    newName.value.trim();

  const accountType =
    newType.value;

  if(!name){

    alert("اكتب اسم التاجر");
    return;

  }

  if(!accountType){

    alert("اختر نوع الحساب");
    return;

  }

  const t = {

    id:uid(),

    name:name,

    phone:
      newPhone.value.trim(),

    notes:
      newNotes.value.trim(),

    accountType:accountType,

    created:Date.now()

  };

  db.traders.unshift(t);

  const opening =
    Number(newAmount.value);

  if(opening > 0){

    db.entries.push({

      id:uid(),

      tid:t.id,

      type:"charge",

      amount:opening,

      note:"رصيد افتتاحي",

      date:today(),

      time:Date.now()

    });

  }

  save();

  openAccount(t.id);

}


function renderTraders(){

  const q =
    search.value
    .trim()
    .toLowerCase();

  const list =
    db.traders.filter(
      t =>
      (
        t.name +
        " " +
        (t.phone || "")
      )
      .toLowerCase()
      .includes(q)
    );

  const receive =
    list.filter(
      t => t.accountType === "receive"
    );

  const pay =
    list.filter(
      t => t.accountType === "pay"
    );

  const none =
    list.filter(
      t => !t.accountType
    );


  const allReceive =
    db.traders.filter(
      t => t.accountType === "receive"
    );

  const allPay =
    db.traders.filter(
      t => t.accountType === "pay"
    );


  countReceive.textContent =
    allReceive.length;

  countPay.textContent =
    allPay.length;


const receiveILS = allReceive.reduce(
  (sum,t) => sum + Math.max(0, remaining(t.id, "ILS")),
  0
);

const receiveUSD = allReceive.reduce(
  (sum,t) => sum + Math.max(0, remaining(t.id, "USD")),
  0
);

const payILS = allPay.reduce(
  (sum,t) => sum + Math.max(0, remaining(t.id, "ILS")),
  0
);

const payUSD = allPay.reduce(
  (sum,t) => sum + Math.max(0, remaining(t.id, "USD")),
  0
);

totalReceive.textContent =
  `₪ ${receiveILS.toLocaleString()} / $ ${receiveUSD.toLocaleString()}`;

totalPay.textContent =
  `₪ ${payILS.toLocaleString()} / $ ${payUSD.toLocaleString()}`;


  traderList.innerHTML =

    sectionHtml(
      "إلي عند التجار",
      receive,
      "receive"
    )

    +

    sectionHtml(
      "للتجار عندي",
      pay,
      "pay"
    )

    +

    (
      none.length
      ?
      sectionHtml(
        "حدد نوع الحساب",
        none,
        "none"
      )
      :
      ""
    );

}


function sectionHtml(title,list,kind){

  if(!list.length){
    return "";
  }

  return `

    <div class="section-title">
      ${title}
    </div>

    ${list.map(t => `

      <div
        class="trader"
        onclick="openAccount('${t.id}')"
      >

        <div class="trader-head">

          <b>
            ${esc(t.name)}
          </b>

          <span class="balance">
            ${money(remaining(t.id))}
          </span>

        </div>

        <div class="muted">
          ${esc(t.phone || "بدون رقم")}
        </div>

        <span class="tag ${kind}">

          ${
            kind === "receive"
            ? "لي عنده"
            :
            kind === "pay"
            ? "له عندي"
            :
            "حدد النوع"
          }

        </span>

      </div>

    `).join("")}

  `;

}


function openAccount(tid){

  currentTrader = tid;

  const t =
    db.traders.find(
      x => x.id === tid
    );

  if(!t){
    return;
  }

  accountName.textContent =
    t.name;

  accountType.value =
    t.accountType || "";

  amount.value = "";

  entryDate.value =
    today();

  entryNote.value = "";

  renderAccount();

  show("accountScreen");

}


function changeType(){

  const t =
    db.traders.find(
      x => x.id === currentTrader
    );

  if(!t){
    return;
  }

  t.accountType =
    accountType.value;

  save();

  renderAccount();

}


function renderAccount(){

  const t =
    db.traders.find(
      x => x.id === currentTrader
    );

  if(!t){
    return;
  }


  if(t.accountType === "pay"){

    balanceLabel.textContent =
      "المتبقي للتاجر عندي";

  }else if(
    t.accountType === "receive"
  ){

    balanceLabel.textContent =
      "المتبقي إلي عنده";

  }else{

    balanceLabel.textContent =
      "المبلغ المتبقي";

  }


const cur = currency.value || "ILS";
const bal = remaining(t.id, cur);
accountBalance.textContent =
  (cur === "USD" ? "$ " : "₪ ") + Number(bal).toFixed(2);
    
      
  


  const es =
    traderEntries(t.id)
    .filter(e => (e.currency || "ILS") === cur)
    .sort(
      (a,b) =>
      (b.time || 0) -
      (a.time || 0)
    );


  entries.innerHTML =
    es.length
    ?
    es.map(e => `

      <div class="entry">

        <div class="entry-top">

          <b>
            ${
              isCharge(e)
              ? "إضافة مبلغ"
              : "دفعة"
            }
          </b>

          <b>
            ${(e.currency || "ILS") === "USD" ? "$ " : "₪ "}${Number(e.amount).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
          </b>

        </div>

        <div class="muted">

          ${
            esc(
              e.date ||
              new Date(
                e.time || Date.now()
              )
              .toISOString()
              .slice(0,10)
            )
          }

          ${
            e.note
            ?
            " — " + esc(e.note)
            :
            ""
          }

        </div>
<button class="red" onclick="deleteEntry('${e.id}')">🗑 حذف</button>
      </div>

    `).join("")
    :
    `
      <div class="muted">
        لا توجد حركات بعد
      </div>
    `;

}


function addEntry(type){

  const t =
    db.traders.find(
      x => x.id === currentTrader
    );

  if(!t){
    return;
  }

  if(!t.accountType){

    alert(
      "حدد أولاً: لي عنده أو له عندي"
    );

    return;
  }


  const a =
    Number(amount.value);


  if(!(a > 0)){

    alert("اكتب المبلغ");
    return;

  }


  db.entries.push({

    id:uid(),

    tid:currentTrader,

    type:type,

    amount:a,
currency: currency.value,
    note:
      entryNote.value.trim(),

    date:
      entryDate.value ||
      today(),

    time:Date.now()

  });


  save();


  amount.value = "";

  entryNote.value = "";

  entryDate.value =
    today();


  renderAccount();

}function deleteEntry(id){
  const t = db.traders.find(x => x.id === currentTrader);
  if(!t) return;

  if(!confirm("متأكد بدك تحذف هذه الحركة؟")) return;

db.entries = db.entries.filter(e => e.id !== id);

  save();
  renderAccount();
}


function exportBackup(){

  const blob =
    new Blob(
      [
        JSON.stringify(
          db,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    "dadoush-backup.json";

  a.click();


  setTimeout(
    () =>
    URL.revokeObjectURL(
      a.href
    ),
    1000
  );

}


function importBackup(ev){

  const f =
    ev.target.files[0];

  if(!f){
    return;
  }

  const r =
    new FileReader();


  r.onload = () => {

    try{

      const x =
        JSON.parse(r.result);


      if(
        !Array.isArray(x.traders) ||
        !Array.isArray(x.entries)
      ){

        throw new Error();

      }


      db = x;

      save();

      renderTraders();

      alert(
        "تم استرجاع البيانات"
      );

    }catch(e){

      alert(
        "ملف النسخة الاحتياطية غير صالح"
      );

    }

  };


  r.readAsText(f);

  ev.target.value = "";

}


load();

renderTraders();


if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    () =>
    navigator
      .serviceWorker
      .register("./sw.js")
      .catch(() => {})
  );

}

</script>

</body>
</html>
